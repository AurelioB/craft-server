# Optional: persistent updater logs in LOG_DIR in addition to container logs.
# Enable with COMPOSE_FILE=compose.yaml:compose.logs.yaml in .env.
services:
  updater:
    environment:
      CRAFT_LOG_DIR: /srv/logs
      CRAFT_HOST_LOG_DIR: ${LOG_DIR}
    volumes:
      - type: bind
        source: ${LOG_DIR:?set LOG_DIR in .env}
        target: /srv/logs
        bind:
          create_host_path: false
