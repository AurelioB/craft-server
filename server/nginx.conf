# Craft Apps Host web server. Runs unprivileged with a read-only root filesystem; it only reads
# DATA_DIR (mounted read-only at /srv/data) and the launcher (/srv/launcher). App updates never
# require a reload: the updater swaps symlinks that are resolved on every request.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/craft/mime.types;
    default_type application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    access_log /dev/stdout combined;
    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 1k;
    autoindex off;

    # Redirects stay relative so the site works behind any proxy, host name or path prefix.
    absolute_redirect off;

    # Symlinks are written only by the updater (archives with links are rejected). File
    # metadata is not cached, so a swapped `current` link takes effect immediately.
    open_file_cache off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/json application/manifest+json application/wasm image/svg+xml text/plain application/xml;
    # Serve precompressed .gz copies shipped in a release (validated to match the original).
    gzip_static on;

    # Active release of an app, from the resolved `current` symlink.
    map $realpath_root $craft_release {
        "~/(?<v>[^/]+)$" $v;
        default "";
    }

    # Versioned release URLs never change content. Entry pages, service workers and manifests
    # still revalidate so browsers pick up the release layout they belong to.
    map $uri $craft_cache {
        "~/$" "no-cache";
        "~/(index\.html|sw\.js|[^/]*\.webmanifest)$" "no-cache";
        default "public, max-age=31536000, immutable";
    }

    server {
        listen 8080;
        root /srv/data/public;
        index index.html;
        error_page 503 /launcher/installing.html;

        location = /healthz {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            return 200 "ok\n";
        }

        # Per-app readiness: 200 once an active release is published.
        location ~ "^/readyz/(?<app>[a-z0-9][a-z0-9-]{0,62})$" {
            access_log off;
            default_type text/plain;
            add_header Cache-Control "no-store" always;
            root /srv/data/public/$app/current;
            if (!-f $document_root/index.html) {
                return 503 "not ready\n";
            }
            return 200 "ready\n";
        }

        location = / {
            root /srv/launcher;
            include /etc/nginx/craft/headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        location /launcher/ {
            root /srv;
            include /etc/nginx/craft/headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        location = /status.json {
            include /etc/nginx/craft/headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /status.json @status_pending;
        }

        location @status_pending {
            default_type application/json;
            add_header Cache-Control "no-cache" always;
            return 200 '{"apps":[],"updater":{}}';
        }

        # Hidden files (release markers, .htaccess) and the internal pointer are never served.
        location ~ "/\." {
            return 404;
        }

        location ~ "^/[a-z0-9][a-z0-9-]{0,62}/current(/|$)" {
            return 404;
        }

        # Stable entry path: redirect to the active, immutable release URL. Already-open tabs
        # keep requesting the release they loaded.
        location ~ "^/(?<app>[a-z0-9][a-z0-9-]{0,62})/$" {
            add_header Cache-Control "no-cache" always;
            if (!-d /srv/data/public/$app) {
                return 404;
            }
            root /srv/data/public/$app/current;
            if (!-f $document_root/index.html) {
                return 503;
            }
            return 302 $craft_release/$is_args$args;
        }

        location ~ "^/(?<app>[a-z0-9][a-z0-9-]{0,62})$" {
            return 301 $app/$is_args$args;
        }

        location ~ "^/[a-z0-9][a-z0-9-]{0,62}/[0-9A-Za-z][0-9A-Za-z._+-]*/" {
            include /etc/nginx/craft/headers.conf;
            add_header Cache-Control $craft_cache always;
            try_files $uri $uri/ =404;
        }

        location / {
            return 404;
        }
    }

    # Private validation listener: serves unpublished candidates from DATA_DIR/.staging so the
    # updater can test real serving behaviour before promotion. It is not published by Compose;
    # only containers on the project network can reach it.
    server {
        listen 8081;
        root /srv/data/.staging;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ "^/candidate/[^/]+/.*/\." {
            return 404;
        }

        location /candidate/ {
            alias /srv/data/.staging/;
            index index.html;
            include /etc/nginx/craft/headers.conf;
            add_header Cache-Control "no-store" always;
        }

        location / {
            return 404;
        }
    }
}
