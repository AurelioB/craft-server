name: Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' host/Cargo.toml | head -n1)
          test "${GITHUB_REF_NAME#v}" = "$crate" || {
            echo "tag $GITHUB_REF_NAME does not match host/Cargo.toml version $crate"; exit 1; }
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/aureliob/craft-host
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Craft Apps Host
            org.opencontainers.image.description=Self-hosted Craft browser apps and update service
            org.opencontainers.image.source=https://github.com/AurelioB/craft-server
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: ./host
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: x86_64
          - platform: linux/arm64
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Export static musl binary
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/export"
          docker buildx build --platform "$PLATFORM" --target binary \
            --build-arg "VERSION=${VERSION#v}" \
            --output "type=local,dest=$RUNNER_TEMP/export" ./host
      - name: Package binary
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          tar -C "$RUNNER_TEMP/export" -czf \
            "craft-host-${VERSION#v}-${ARCH}-linux-musl.tar.gz" craft-host
      - uses: actions/upload-artifact@v4
        with:
          name: craft-host-${{ matrix.arch }}-linux-musl
          path: craft-host-*.tar.gz
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: craft-host-*-linux-musl
          merge-multiple: true
      - name: Prepare checksums and release notes
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          sha256sum craft-host-*.tar.gz > SHA256SUMS
          awk -v version="${VERSION#v}" '
            $0 ~ "^## \\[" version "\\]([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            craft-host-*.tar.gz
            SHA256SUMS
