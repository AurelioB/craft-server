# Integration-test override: a static fake of the GitHub releases API on the project network,
# and a deliberately small WORK_DIR to exercise disk-space handling. Used by
# host/tests/compose.rs; not for production.
services:
  fakegh:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    user: "${FAKEGH_UID}:${FAKEGH_GID}"
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    entrypoint: ["nginx", "-g", "daemon off;"]
    volumes:
      - type: bind
        source: ${FAKEGH_DIR:?}
        target: /usr/share/nginx/html
        read_only: true

  host:
    volumes:
      - type: tmpfs
        target: /srv/work
        tmpfs:
          size: 1048576
          mode: 01777
