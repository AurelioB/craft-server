# Craft Apps Host configuration. Copy to CONFIG_DIR/config.toml.
# Every setting is optional; the values shown are the defaults. Unknown keys are rejected.
# Sizes accept bytes or units ("512MiB", "2GiB"); durations accept seconds or "30s"/"15m"/"1h"/"1d".

[server]
listen = "0.0.0.0:8080"
# Reverse proxies whose X-Forwarded-Proto/-Host and identity headers are believed (CIDR or
# address). Needed for [auth] methods = ["proxy"] and for Secure cookies behind HTTPS.
trusted_proxies = []           # e.g. ["172.16.0.0/12"]

[updater]
# Continue the schedule on startup: apps whose last successful check is older than
# check_interval (or that never had one) are checked at once. false: wait a full interval.
check_on_startup = true
check_interval = "1h"          # at least 60s
http_timeout = "30s"
download_timeout = "15m"
max_retries = 3                # per request, with exponential backoff
retry_backoff = "5s"
retry_backoff_max = "5m"
github_api_url = "https://api.github.com"
# Optional token: raises the API limit from 60 to 5000 requests per hour, and unchanged release
# lists then cost no quota. Without one, every check counts against the 60 per hour shared by
# everything on this public IP address. A path relative to CONFIG_DIR, readable by the server
# only. The value is never logged or printed.
github_token_file = ""
# When a downloaded release goes live for new visitors: "immediate", or "idle" = once the app
# has received no requests for `idle_after`. Open tabs keep the release they loaded either way.
# Idle detection only sees requests: an app left open in a tab may make none for hours.
activation = "immediate"
idle_after = "30m"
heartbeat_interval = "30s"
lock_wait = "10m"              # how long manual commands wait for a running update
log_max_size = "10MiB"         # only with LOG_DIR (compose.logs.yaml)
log_backups = 5

[limits]
max_download = "512MiB"
max_extracted = "1GiB"
max_files = 5000
max_compression_ratio = 200
min_free_space = "256MiB"      # kept free on DATA_DIR, WORK_DIR and CACHE_DIR

[retention]
keep_latest = 1                # releases kept per app, counting the active one; 2+ allows rollback
keep_days = 0                  # plus every release installed within this many days (0: none)
keep_recently_used = "0"       # e.g. "1h": also keep a replaced release while tabs opened before the
                               # update still load files only it has (0: no grace period)
cache_max_size = "2GiB"        # downloaded archives (least recently used are removed)

[auth]
# How people sign in, for /admin and (optionally) the apps. A list of:
#   local  sign-in page with user name and password (accounts in the user database)
#   oidc   OpenID Connect sign-in (see [auth.oidc]); combines with local
#   basic  HTTP Basic against the user database (alone)
#   proxy  user from a header set by a trusted proxy (forward auth, see [auth.proxy]; alone)
# Empty: nobody signs in; with [admin] enabled, everyone who reaches /admin is an admin (only
# behind a proxy that protects /admin).
# Accounts (user name, e-mail, password, role, linked OIDC identity) live in
# STATE_DIR/users.sqlite3; manage them in /admin or with `craft-host user …`.
methods = []                   # e.g. ["local"], ["oidc"], ["local", "oidc"]
# Who may open the launcher and the apps: "public" (anyone who reaches the server) or
# "signed-in" (accounts with the user or admin role; needs a sign-in method).
apps = "public"
session_ttl = "12h"
cookie_secure = "auto"         # auto (Secure when the client used HTTPS) | always | never
# Roles from the provider's groups (OIDC groups claim / proxy groups header).
# proxy: required, admins are these accounts or members of these groups.
# oidc: optional; when any list is set, the provider decides roles at every sign-in,
# otherwise roles are managed in /admin and new OIDC accounts get the user role.
admin_users = []
admin_groups = []              # e.g. ["craft-admins"]
# Users: members of these groups; empty = every account the provider signs in.
user_groups = []               # e.g. ["craft-users"]

# [auth.oidc]
# name = "Authentik"                          # sign-in button: "Sign in with Authentik"
# issuer = "https://auth.example.net/application/o/craft-apps"
# client_id = "craft-apps"
# client_secret_file = "oidc-client-secret"   # relative to CONFIG_DIR; omit for a public client
# redirect_url = "https://apps.example.net/auth/oidc/callback"
# scopes = ["openid", "profile", "email"]
# username_claim = "preferred_username"
# groups_claim = "groups"
# create_users = true          # first sign-in of an unknown identity creates an account
# link_by_email = false        # true: link an unknown identity to the account with the same
#                              # e-mail address if the provider marks it verified

# [auth.proxy]
# user_header = "Remote-User"       # Authentik: "X-authentik-username"
# groups_header = "Remote-Groups"   # Authentik: "X-authentik-groups" ('|' or ',' separated)

[admin]
# /admin on the same port as the apps, for accounts with the admin role.
enabled = false
# Optional: answer /admin only on this host name (same port), e.g. "admin.apps.example.net",
# and serve no apps there. Without it, /admin shares the apps' browser origin: code served by
# an app could act with a signed-in administrator's session. See docs/admin.md.
host = ""

# Per-app settings. Built-in apps: photocraft, vectorcraft, filmcraft, lightcraft, pdfcraft,
# effectcraft, designcraft. Built-in apps accept only the keys shown here.
#
# [apps.photocraft]
# enabled = true
# auto_update = true            # false: install once, then only on `update`
# pinned_version = ""           # e.g. "0.5.0"; a pin set in /admin or the CLI takes precedence
# channel = "stable"            # or "prerelease"
# entry = "photocraft"          # stable URL path: /photocraft/
# release_dir = "releases/photocraft"   # relative to DATA_DIR
# activation = "immediate"      # or "idle"
# idle_after = "30m"
# keep_latest = 1
# keep_days = 0
# origin = ""                   # e.g. "https://lightcraft.example.net": link the app on its own
#                               # host name so it gets separate browser storage
#
# Additional apps also define name, repository, artifact_patterns and optionally
# checksum_assets, exclude, icon (path inside the release), notes, and launcher metadata
# category, tagline and color ("#rrggbb"):
#
# [apps.examplecraft]
# name = "ExampleCraft"
# repository = "storytold/examplecraft"
# artifact_patterns = ["examplecraft-web-{version}.zip"]
