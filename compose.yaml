# Craft Apps Host. Configure through .env (copy .env.example); see README.md and docs/.
#
# One service: a single static binary that serves the apps under /<app>/, keeps them updated
# from their official GitHub releases in the background, and offers /admin.
# It needs no Docker socket, privileged mode, GPU or database.

name: craft-apps

services:
  host:
    build: ./host
    image: ${IMAGE:-craft-apps-host:local}
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    user: "${RUN_UID:?set RUN_UID in .env}:${RUN_GID:?set RUN_GID in .env}"
    group_add:
      - "${SUPPLEMENTAL_GID:-${RUN_GID}}"
    command: ["serve"]
    working_dir: ${WORKING_DIR:-/srv/work}
    tmpfs:
      - /tmp:mode=1777,size=16m
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${PORT:-8080}:8080"
    environment:
      FILE_UMASK: ${FILE_UMASK:-0022}
      CRAFT_LOG_LEVEL: ${LOG_LEVEL:-info}
      # Used only by `doctor` for checks and preparation hints.
      RUN_UID: ${RUN_UID}
      RUN_GID: ${RUN_GID}
      CRAFT_HOST_CONFIG_DIR: ${CONFIG_DIR}
      CRAFT_HOST_DATA_DIR: ${DATA_DIR}
      CRAFT_HOST_STATE_DIR: ${STATE_DIR}
      CRAFT_HOST_CACHE_DIR: ${CACHE_DIR}
      CRAFT_HOST_WORK_DIR: ${WORK_DIR}
    volumes:
      - type: bind
        source: ${CONFIG_DIR:?set CONFIG_DIR in .env}
        target: /config
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DATA_DIR:?set DATA_DIR in .env}
        target: /srv/data
        bind:
          create_host_path: false
      - type: bind
        source: ${STATE_DIR:?set STATE_DIR in .env}
        target: /srv/state
        bind:
          create_host_path: false
      - type: bind
        source: ${CACHE_DIR:?set CACHE_DIR in .env}
        target: /srv/cache
        bind:
          create_host_path: false
      - type: bind
        source: ${WORK_DIR:?set WORK_DIR in .env}
        target: /srv/work
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/craft-host", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
